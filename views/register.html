<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#D92D20">
  <link rel="icon" href="/img/varam-logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <title>Create account · Varam</title>
  <meta name="robots" content="noindex">
</head>
<body>
  <div id="site-header"></div>
  <main id="main" class="auth-wrap">
    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="sub">Save your address, track orders and reorder in one click.</p>
      <form class="form" id="register-form" novalidate>
        <div class="form-error hidden" role="alert"></div>
        <div class="field"><label for="name">Full name</label><input class="input" id="name" name="name" autocomplete="name" required></div>
        <div class="field"><label for="email">Email</label><input class="input" id="email" name="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="phone">Mobile number</label><input class="input" id="phone" name="phone" inputmode="tel" autocomplete="tel" placeholder="10-digit mobile" required></div>
        <div class="field"><label for="password">Password</label><input class="input" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required><span class="muted" style="font-size:12px">At least 8 characters</span></div>
        <button class="btn btn-primary btn-block" type="submit">Create account</button>
      </form>
      <p class="alt">Already have an account? <a href="/login">Sign in</a></p>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
