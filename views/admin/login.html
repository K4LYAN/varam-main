<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin sign in · Varam</title>
  <link rel="icon" href="/img/varam-logo.jpg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-login">
  <main class="auth-wrap" style="min-height:100vh">
    <div class="auth-card">
      <div class="brand" style="margin-bottom:18px"><img src="/img/varam-logo.jpg" alt="" width="44" height="44"><span><b>VARAM</b><small>ADMIN PANEL</small></span></div>
      <h1>Admin sign in</h1>
      <p class="sub">Manage products, prices, stock, orders and store settings.</p>
      <form class="form" id="admin-login" novalidate>
        <div class="form-error hidden" role="alert"></div>
        <div class="field"><label for="identifier">Email</label><input class="input" id="identifier" name="identifier" type="email" autocomplete="username" required></div>
        <div class="field"><label for="password">Password</label><input class="input" id="password" name="password" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-primary btn-block" type="submit">Sign in</button>
      </form>
      <p class="alt"><a href="/">&larr; Back to the store</a></p>
    </div>
  </main>
  <script src="/js/admin-login.js"></script>
</body>
</html>
