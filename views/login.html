<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7A2E1D">
  <link rel="icon" href="/img/varam-logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Tiro+Telugu&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/effects.css">
  <link rel="stylesheet" href="/css/theme.css">
  <title>Login · Varam</title>
  <meta name="robots" content="noindex">
</head>
<body>
  <div id="site-header"></div>
  <main id="main" class="auth-wrap">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="sub">Sign in to see your orders and keep your cart on every device.</p>
      <form class="form" id="login-form" novalidate>
        <div class="form-error hidden" role="alert"></div>
        <div class="field"><label for="identifier">Email or mobile number</label><input class="input" id="identifier" name="identifier" autocomplete="username" required></div>
        <div class="field"><label for="password">Password</label><input class="input" id="password" name="password" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-primary btn-block" type="submit">Sign in</button>
      </form>
      <p class="alt">New to Varam? <a href="/register">Create an account</a></p>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="/js/motion.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
