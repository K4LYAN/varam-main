<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7A2E1D">
  <meta name="robots" content="noindex">
  <title>My account · Varam</title>
  <link rel="icon" href="/img/varam-logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Tiro+Telugu&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/effects.css">
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
  <div id="site-header"></div>
  <main id="main">
    <section class="acct-hero">
      <div class="container">
        <div class="avatar" id="avatar" aria-hidden="true">V</div>
        <div>
          <h1 id="hello" data-reveal="fade-up">Welcome back</h1>
          <p id="member" data-reveal="fade-up" data-delay="100"></p>
          <span class="tier" id="tier" data-reveal="fade-up" data-delay="180"></span>
        </div>
      </div>
    </section>

    <div class="container acct-wrap">
      <div class="acct-stats" id="stats" data-reveal data-stagger="80">
        <div class="stat"><span>Orders</span><b>—</b></div>
        <div class="stat"><span>Total spent</span><b>—</b></div>
        <div class="stat"><span>Active orders</span><b>—</b></div>
        <div class="stat"><span>Saved with coupons</span><b>—</b></div>
      </div>

      <div class="acct-tabs" role="tablist" aria-label="Account sections" id="tabs">
        <button type="button" role="tab" data-tab="overview" aria-selected="true">Overview</button>
        <button type="button" role="tab" data-tab="orders" aria-selected="false">Orders <span class="count" id="c-orders">0</span></button>
        <button type="button" role="tab" data-tab="addresses" aria-selected="false">Addresses <span class="count" id="c-addresses">0</span></button>
        <button type="button" role="tab" data-tab="wishlist" aria-selected="false">Wishlist <span class="count" id="c-wishlist">0</span></button>
        <button type="button" role="tab" data-tab="profile" aria-selected="false">Profile &amp; security</button>
      </div>

      <section role="tabpanel" id="panel" aria-live="polite"></section>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="/js/motion.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/account.js"></script>
</body>
</html>
