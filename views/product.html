<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7A2E1D">
  {{SEO_HEAD}}
  <link rel="icon" href="/img/varam-logo.jpg">
  <link rel="apple-touch-icon" href="/img/varam-logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Tiro+Telugu&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/effects.css">
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
  <div id="site-header"></div>
  <main id="main" class="container">
    <nav class="breadcrumbs" aria-label="Breadcrumb" id="crumbs"><a href="/">Home</a><span>/</span><a href="/shop">Shop</a><span>/</span><span aria-current="page">{{PRODUCT_NAME}}</span></nav>
    <div class="pdp" id="pdp">
      <div class="pdp-media skeleton" aria-hidden="true"></div>
      <div><div class="skeleton" style="min-height:420px"></div></div>
    </div>
    <section class="section" style="padding-top:24px" aria-labelledby="related-title">
      <div class="section-head" data-reveal="blur-in"><div><span class="kicker">More from Varam</span><h2 id="related-title">You may also like</h2></div></div>
      <div class="grid" id="related"></div>
    </section>
  </main>
  <div class="sticky-buy" id="sticky-buy" aria-hidden="true"></div>
  <div id="site-footer"></div>
  <script src="/js/motion.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/product.js"></script>
</body>
</html>
